<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gozdni med | Čebelarstvo Hrenovec</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Lato&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Lato', sans-serif;
            background: #faf8f3;
            color: #3d2a14;
        }

        .container {
            max-width: 1000px;
            margin: 80px auto;
            padding: 0 24px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }

        img {
            width: 100%;
            border-radius: 22px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
        }

        h1 {
            font-family: 'Playfair Display', serif;
        }

        .price {
            font-size: 1.4rem;
            font-weight: bold;
            margin: 20px 0;
        }

        /* NOVO: wrapper za gumbe */
        .buttons {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .btn {
            display: inline-block;
            padding: 14px 32px;
            background: linear-gradient(135deg,#f5c842,#c9912b);
            border-radius: 12px;
            color: #3d2a14;
            text-decoration: none;
            font-weight: 600;
            border: none;
            cursor: pointer;
        }

        /* POPUP */
        #popup {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }

        #popup-box {
            background: white;
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
    </style>
</head>

<body>

<main class="container">
    <img src="noveslike/gozdni.png" alt="Gozdni med">

    <div>
        <h1>Gozdni med</h1>

        <p>
            Gozdni med je temnejši med z bogatim, polnim okusom.
            Pridobljen je iz mane gozdnih dreves in je izredno cenjen
            zaradi svoje sestave in arom.
        </p>

        <p>
            ✔️ bogat z minerali<br>
            ✔️ intenziven okus<br>
            ✔️ slovenski izvor
        </p>

        <div class="price">9,50 €</div>

        <!-- NOVO: wrapper -->
        <div class="buttons">
            <button class="btn" onclick="addToCart('Gozdni med', 9.50)">
                Dodaj v košarico
            </button>

            <a href="trgovina.html" class="btn">Nazaj v trgovino</a>
            <a href="Čebelarstvo Hrenovec.html" class="btn">Domov</a>
        </div>
    </div>
</main>

<!-- POPUP -->
<div id="popup">
    <div id="popup-box">
        <h3>Izdelek dodan v košarico 🛒</h3>
        <br>
        <button class="btn" onclick="goToCart()">Pojdi v košarico</button>
        <button class="btn" onclick="closePopup()">Nadaljuj nakup</button>
    </div>
</div>

<script>
// Dodaj v košarico
function addToCart(name, price) {
    let cart = JSON.parse(localStorage.getItem('cart')) || [];

    cart.push({
        name: name,
        price: price,
        img: "noveslike/gozdni.png"
    });

    localStorage.setItem('cart', JSON.stringify(cart));

    document.getElementById('popup').style.display = 'flex';
}

// pojdi v košarico
function goToCart(){
    window.location.href = 'košarica.html';
}

// zapri popup
function closePopup(){
    document.getElementById('popup').style.display = 'none';
}
</script>

</body>
</html>
